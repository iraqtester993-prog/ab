<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NetTower Pro - نظام إدارة الأبراج</title>
<link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NetTower Pro">
<!-- Google Fonts: Tajawal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- ملف التنسيقات الأساسي -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- شاشة خطأ إذا فشل تحميل Vue -->
<div id="vue-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#121217;color:#e17055;font-family:Tajawal,sans-serif;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;text-align:center;direction:rtl">
  <div style="font-size:48px">⚠️</div>
  <h2 style="color:#fcf8ff;font-size:20px">فشل تحميل المكتبات الأساسية</h2>
  <p style="color:#c8c4d7;max-width:400px;line-height:1.8">تأكد من اتصالك بالإنترنت. إذا كنت تستخدم VPN أو Proxy، حاول تعطيله. أو استخدم متصفحاً آخر.</p>
</div>

<!-- Toast و Modal خارج Vue لأنها تُستدعى من دوال عامة -->
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="mhead">
    <h3 id="modalTitle">العنوان</h3>
    <button onclick="closeModal()"><i class="fas fa-times"></i></button>
  </div>
  <div id="modalBody"></div>
</div>

<!-- نقطة ربط Vue -->
<div id="app"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#121217;color:#c8c4d7;font-family:Tajawal,sans-serif;font-size:16px">جاري تحميل النظام...</div></div>

<!-- Vue 3 + Vue Router 4 عبر CDN مع fallback -->
<script>
// التحقق من نجاح تحميل Vue
window.__vueLoaded = false;
window.__routerLoaded = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"
        onload="window.__vueLoaded = true"
        onerror="document.getElementById('vue-error').style.display='flex'"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js"
        onload="window.__routerLoaded = true"
        onerror="document.getElementById('vue-error').style.display='flex'"></script>

<!-- دوال Vue/VueRouter المشتركة (يجب أن يكون أول ملف بعد CDN) -->
<script src="js/shared.js"></script>

<!-- طبقة البيانات -->
<script src="js/data.js"></script>

<!-- صفحات النظام (ملف واحد مدمج) -->
<script src="js/pages.js"></script>

<!-- مكونات التخطيط (Layout Components) -->
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>

<!-- دوال عامة للمودالات -->
<script src="js/globals.js"></script>

<!-- تشغيل التطبيق (يجب أن يكون آخر ملف) -->
<script src="js/app.js"></script>

<!-- PWA: تسجيل Service Worker -->
<script src="registerSW.js"></script>

<!-- PWA: زر التثبيت -->
<style>
.pwa-install-btn{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9000;
  background:linear-gradient(135deg,#6c5ce7,#5341cd);color:#fff;
  padding:12px 28px;border-radius:50px;border:none;
  font-size:14px;font-weight:800;font-family:'Tajawal',sans-serif;
  cursor:pointer;display:none;align-items:center;gap:8px;
  box-shadow:0 6px 24px rgba(108,92,231,.45);
  transition:.3s cubic-bezier(.22,.68,0,1);
  animation:pwaPulse 2s ease-in-out infinite
}
.pwa-install-btn:hover{transform:translateX(-50%) scale(1.05);box-shadow:0 8px 32px rgba(108,92,231,.55)}
.pwa-install-btn:active{transform:translateX(-50%) scale(.97)}
.pwa-install-btn i{font-size:18px}
.pwa-install-btn.show{display:flex}
@keyframes pwaPulse{0%,100%{box-shadow:0 6px 24px rgba(108,92,231,.45)}50%{box-shadow:0 6px 32px rgba(108,92,231,.65)}}
@media(max-width:768px){.pwa-install-btn{bottom:calc(var(--nav-h,68px) + 16px)}}
</style>
<button class="pwa-install-btn" id="pwaInstallBtn" onclick="window._pwaInstall()">
  <i class="fas fa-download"></i> تثبيت التطبيق
</button>
<script>
window._deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  window._deferredPrompt = e;
  var btn = document.getElementById('pwaInstallBtn');
  if (btn) btn.classList.add('show');
});
window._pwaInstall = function() {
  if (!window._deferredPrompt) return;
  window._deferredPrompt.prompt();
  window._deferredPrompt.userChoice.then(function(r) {
    if (r.outcome === 'accepted') {
      var t = document.getElementById('toast');
      if (t) { t.innerHTML = '✅ تم تثبيت التطبيق'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show') }, 2800); }
    }
    window._deferredPrompt = null;
    var btn = document.getElementById('pwaInstallBtn');
    if (btn) btn.classList.remove('show');
  });
};
window.addEventListener('appinstalled', function() {
  window._deferredPrompt = null;
  var btn = document.getElementById('pwaInstallBtn');
  if (btn) btn.classList.remove('show');
});
</script>

</body>
</html>
